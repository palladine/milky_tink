syntax = "proto3";

package tinkoff.public.invest.api.contract.v1;


import "google/protobuf/timestamp.proto";





message Quotation {
    int64 units = 1;
    int32 nano = 2;
}


message Order {
    Quotation price = 1;
    int64 quantity = 2;
}


message GetOrderBookRequest {
    string figi = 1;
    int32 depth = 2;
    string instrument_id = 3;
}



message GetOrderBookResponse {
    string figi = 1;
    int32 depth = 2;
    repeated Order bids = 3;
    repeated Order asks = 4;
    Quotation last_price = 5;
    Quotation close_price = 6;
    Quotation limit_up = 7;
    Quotation limit_down = 8;
    string instrument_uid = 9;
    string ticker = 10;
    string class_code = 11;
    google.protobuf.Timestamp last_price_ts = 12;
    google.protobuf.Timestamp close_price_ts = 13;
    google.protobuf.Timestamp orderbook_ts = 14;
}




service MarketDataService {
    rpc GetOrderBook (GetOrderBookRequest) returns (GetOrderBookResponse);
}